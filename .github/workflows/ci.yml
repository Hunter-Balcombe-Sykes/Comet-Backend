name: CI

on:
  # `production` is the repo's DEFAULT branch, so a PR opened in the GitHub UI targets
  # it unless retargeted — without it listed here that PR would show no checks at all.
  pull_request:
    branches: [main, development-v2, development, production]
  # Laravel Cloud deploys `production` on push and does not wait on Actions, so this
  # trigger is post-hoc telemetry, not a gate. A routine deploy is a fast-forward of an
  # already-green `development` tip, where it is redundant by construction; its value is
  # catching the abnormal case — a commit that reached `production` without CI ever
  # seeing it. Treat a red run here as "roll back", not "don't ship".
  push:
    branches: [main, development, production]
  schedule:
    # Weekly dependency-advisory check (Sun 20:00 UTC = Mon ~6am AEST). New CVEs
    # land against an unchanged composer.lock/package-lock.json, so push-triggered
    # CI alone misses them during quiet weeks. Only the supply-chain job runs on
    # this trigger — test/schema-drift are code-driven and skip it.
    # NOTE: GitHub registers cron triggers from the DEFAULT branch's copy of this
    # file, so this block must exist on that branch to fire at all.
    - cron: '0 20 * * 0'

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Locked to least-privilege — add per-step permissions explicitly if a future step needs the token.

    env:
      # `composer install` runs package:discover (post-autoload-dump), which boots
      # the app BEFORE the "Copy env" step creates .env. Without APP_ENV, Laravel
      # defaults to production and AppServiceProvider's F2 AUTH-1 guard aborts the
      # boot because SUPABASE_JWT_ISSUER is unset. Declaring CI as testing takes the
      # guard's local/testing exemption. The test run already uses testing (phpunit.xml).
      APP_ENV: testing

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Security audit
        run: composer audit

      - name: Copy env
        id: copy_env
        run: cp .env.example .env && php artisan key:generate

      # Every gate from here down carries `if: !cancelled() && copy_env succeeded`.
      #
      # Without it a step failure skips every LATER step, so one red gate silently
      # disables all the others — and each time that happened, code landed with no
      # scan at all. The GS-1 allowlist below records four separate rounds of
      # exactly that (2026-06-12, 07-22, 07-25, 07-28); the last one hid seven
      # gates for two days and ~40 runs. These checks are mutually independent —
      # they need only a working install + .env, never each other's output — so
      # running them all and reporting every failure per push costs nothing and is
      # the difference between "PHPStan is red" and "PHPStan, Checkpoint, pint and
      # GS-1 are red".
      #
      # Gated on copy_env rather than bare !cancelled() so a broken install or
      # missing .env still short-circuits, instead of emitting nine confusing
      # downstream failures that all trace back to one cause.
      #
      # The job still fails if ANY gate fails. This changes reporting, not strictness.

      - name: Static analysis (PHPStan level 5)
        if: ${{ !cancelled() && steps.copy_env.outcome == 'success' }}
        run: composer analyse

      - name: Security scan (Checkpoint)
        if: ${{ !cancelled() && steps.copy_env.outcome == 'success' }}
        # False positives are suppressed by hash in config/checkpoint.php. FAIL
        # (not WARN) breaks the build — see ScanCommand::outputTable in
        # vendor/andreapollastri/checkpoint.
        run: php artisan checkpoint:scan

      - name: Security audit (Vigil)
        if: ${{ !cancelled() && steps.copy_env.outcome == 'success' }}
        # env-dependent checks (APP_DEBUG, headers) are only meaningful on the
        # deployed env; this CI gate covers filesystem/secrets/dependency checks.
        # APP_DEBUG=false neutralises the synthetic CI .env (.env.example already
        # defaults to false, but this keeps the gate correct if that ever drifts).
        run: APP_DEBUG=false php artisan vigil:audit --fail-on=critical

      - name: Check code style
        if: ${{ !cancelled() && steps.copy_env.outcome == 'success' }}
        run: vendor/bin/pint --test

      - name: Check for inline auth bypasses in controllers
        if: ${{ !cancelled() && steps.copy_env.outcome == 'success' }}
        run: |
          # Inline 403 aborts in controllers bypass the Policy layer — use authorizeForUser() instead.
          # Pattern catches abort(403, ...), abort_unless(..., 403, ...), abort_if(..., 403, ...).
          # If the abort is actually input validation (stale IDs etc.), use abort(422, ...) — see the bulk-id reorder pattern in ProfessionalServiceController for precedent.
          INLINE_403=$(grep -rE "abort\(403|abort_unless|abort_if" app/Http/Controllers/ | grep "403" | wc -l | tr -d ' ')

          if [ "$INLINE_403" -gt 0 ]; then
            echo "::error::Found $INLINE_403 inline 403 abort(s) in controllers. Use a Policy via authorizeForUser() for authorization, or abort(422, ...) if it's really input validation."
            grep -rEn "abort\(403|abort_unless|abort_if" app/Http/Controllers/ | grep "403"
            exit 1
          fi

          echo "No inline auth bypasses found."

      - name: No raw Cache::* calls outside cache services (GS-1)
        if: ${{ !cancelled() && steps.copy_env.outcome == 'success' }}
        run: |
          # GS-1: Cache keys must flow through CacheKeyGenerator and a *CacheService
          # to preserve tenant-prefix discipline. A rogue Cache::put('user_count', $n)
          # in a controller is one git push away from a cross-tenant data leak — this
          # lint blocks that class of bug before it reaches review.
          #
          # Allowlisted by path:
          #   - app/Services/Cache/                  — the canonical cache layer itself
          #   - app/Http/Controllers/Api/Webhooks/   — Cache::add() for idempotency dedupe
          #   - pre-existing legitimate callers      — file-level entries below.
          # New code MUST route through a cache service. To add a new exception,
          # justify it in PR review and append the path here.
          #
          # File-level exceptions (audited 2026-06-12 — the guard shipped while CI
          # was failing at the pint step, so these pre-existing callers were never
          # caught; each is a deliberate pattern, not a tenant-key leak):
          #   - CustomerObserver            — Cache::forget via CacheKeyGenerator; direct invalidation in observer, no service injection point
          #   - SupabaseEmailHookController — Cache::add SETNX webhook dedupe + Cache::forget rollback on send failure
          #   - InstagramController         — refresh budget + cooldown via atomic Cache::add (comments also match the grep)
          #   - ShopController              — short-lived picker-catalog cache, keys via CacheKeyGenerator
          #   - IndividualProfileController — docblock mention only (grep matches the comment)
          #   - IdempotencyKey middleware   — the idempotency exception the error copy itself names
          #   - LogLeadRateLimits           — Cache::add SETNX dedupe of auto-retry log bursts
          #   - SendFeedbackEmailJob        — job idempotency SETNX + rollback
          #   - AnalyticsCacheService       — IS a *CacheService, just lives under Services/Analytics/
          #   - AnalyticsDedupGuard         — atomic SETNX fixed-window dedup utility
          #   - FeatureFlagService          — flag registry/per-pro invalidation (Cache::forget)
          #   - YoutubeThumbnailResolver    — thumbnail-tier memo with jittered TTL
          #   - AppleSearch                 — iTunes API response cache, key via CacheKeyGenerator (same pattern as YoutubeThumbnailResolver)
          #   - RefreshController           — Cache::add SETNX per-user refresh cooldown (key is user+platform scoped)
          #   - DispatchEnquiryNotificationsJob — Cache::put notify-once idempotency guard (enquiry-id scoped)
          # File-level exceptions (audited 2026-07-22 — same story: the whole gate
          # chain after composer audit was masked, so these pre-existing callers were
          # never caught until the chain was fixed. Each key is scoped/content-addressed
          # — vetted, not a tenant leak):
          #   - StaffAggregateAnalyticsController — staff-only aggregate; key encodes the full scope (all|segment-hash)+window; cross-tenant BY DESIGN (staff see all), so tenant isolation is N/A
          #   - GoogleBusinessEnrichJob     — paid-Apify inflight/result guard, keys via CacheKeyGenerator::googleBusinessApify*(userId, placeId) (same pattern as InstagramController)
          #   - OwnMediaAccentFactor        — content-addressed memo (key = md5 of image URL); value is a non-sensitive computed hex colour
          #   - StorePricePointFactor       — site-scoped streak key (design:store-price-streak:<site_id>)
          #   - AccountDeletionService      — Cache::forget of the user's OWN idempotency keys (enumerated from idempotencyIndexKey(authUserId)) during account teardown
          # File-level exceptions (audited 2026-07-25 — same story a third time: all
          # three landed while CI was red at PHPStan/Checkpoint, so GS-1 never ran
          # on them. Each key is scoped/content-addressed — vetted, not a leak):
          #   - DedupesRecipientSends       — RV-10 per-recipient Cache::add SETNX claim + Cache::forget rollback; key is action-log-scoped and content-addressed (sha256 of "<actionLogId>|<recipient>"), same pattern as SendFeedbackEmailJob
          #   - MenuApifyScraper            — negative-cache "blocked/hard_error" marker + its recovery forget, key via CacheKeyGenerator::menuScrapeBlocked(platform, url) (same shape as YoutubeThumbnailResolver/AppleSearch)
          #   - ShopBrandSeeder             — picker-catalog warm mirroring addBrand()'s, key via CacheKeyGenerator::shopifyBrandCatalog($id); ShopController is already allowlisted for this exact cache
          # File-level exceptions (audited 2026-07-28 — a FOURTH round of the same
          # story: all three landed while CI was red at PHPStan, so GS-1 never ran
          # on them. Each key is scoped/content-addressed — vetted, not a leak):
          #   - RecordScheduledTaskHeartbeat — scheduler liveness beacon; key is the class const prefix + a normalized TASK name (taskKey()), carries no tenant identity at all
          #   - ProbeBudget                 — atomic Cache::add SETNX counter init (+increment/decrement), keys via CacheKeyGenerator::routingProbe{Global,User}Daily(); same shape as AnalyticsDedupGuard/RefreshController. The docblock at :24 also matches the grep
          #   - ProbeGate                   — probe-answer memo incl. negative results, key via CacheKeyGenerator::routingProbeUrl($url) — content-addressed by URL (same shape as YoutubeThumbnailResolver/AppleSearch/MenuApifyScraper)
          #   - LinkProjector               — Cache::add SETNX throttling malformed-pattern error reports to once per detector+field per window, so one bad catalog entry cannot flood Nightwatch. Key is "routing:malformed-detector:{$detectorId}:{$field}" — BOTH segments are catalog-level identifiers, not user- or site-scoped, so there is no tenant prefix to preserve and no cross-tenant collision to cause. Same idiom and same reasoning as LogLeadRateLimits and AnalyticsDedupGuard, which its own docblock (:204) cites as precedent and which are already excluded below.
          #
          # -P (PCRE), not -E. The pattern needs \b at both ends — leading, so
          # MyCache::put doesn't match; trailing, so Cache::adder doesn't. BSD
          # regcomp (macOS) does not support \b in ERE and silently matches
          # nothing, so `-E` made this guard report a clean pass locally no
          # matter what was written, while the same command on the glibc runner
          # found 50 lines. -P behaves identically on both.
          set +e
          BAD=$(git grep -n -P '\bCache::(put|remember|rememberForever|forget|add)\b' -- \
            'app/' \
            ':!app/Services/Cache/' \
            ':!app/Http/Controllers/Api/Webhooks/' \
            ':!app/Http/Controllers/Api/HealthController.php' \
            ':!app/Observers/Core/CustomerObserver.php' \
            ':!app/Http/Controllers/Api/Internal/SupabaseEmailHookController.php' \
            ':!app/Http/Controllers/Api/Platforms/InstagramController.php' \
            ':!app/Http/Controllers/Api/Platforms/ShopController.php' \
            ':!app/Http/Controllers/Api/PublicSite/IndividualProfileController.php' \
            ':!app/Http/Middleware/IdempotencyKey.php' \
            ':!app/Http/Middleware/Logging/LogLeadRateLimits.php' \
            ':!app/Jobs/Notifications/SendFeedbackEmailJob.php' \
            ':!app/Services/Analytics/AnalyticsCacheService.php' \
            ':!app/Services/Analytics/AnalyticsDedupGuard.php' \
            ':!app/Services/FeatureFlags/FeatureFlagService.php' \
            ':!app/Http/Controllers/Api/Platforms/RefreshController.php' \
            ':!app/Jobs/Notifications/DispatchEnquiryNotificationsJob.php' \
            ':!app/Services/Platforms/YoutubeThumbnailResolver.php' \
            ':!app/Services/Platforms/AppleSearch.php' \
            ':!app/Http/Controllers/Api/Staff/Analytics/StaffAggregateAnalyticsController.php' \
            ':!app/Jobs/Platforms/GoogleBusinessEnrichJob.php' \
            ':!app/Services/Design/Presets/Factors/OwnMediaAccentFactor.php' \
            ':!app/Services/Design/Presets/Factors/StorePricePointFactor.php' \
            ':!app/Services/User/AccountDeletionService.php' \
            ':!app/Jobs/Moderation/Concerns/DedupesRecipientSends.php' \
            ':!app/Services/Platforms/MenuApifyScraper.php' \
            ':!app/Services/Platforms/ShopBrandSeeder.php' \
            ':!app/Listeners/RecordScheduledTaskHeartbeat.php' \
            ':!app/Routing/Probes/ProbeBudget.php' \
            ':!app/Routing/LinkProjector.php' \
            ':!app/Routing/Probes/ProbeGate.php')
          RC=$?
          set -e
          # git grep: 0 = matches found, 1 = none, >1 = the scan itself failed
          # (bad pathspec, git built without PCRE, ...). `set +e` above turns any
          # such failure into an empty $BAD and a green "no raw Cache:: calls" —
          # a guard that reports success precisely when it did not run. Fail loud.
          if [ "$RC" -gt 1 ]; then
            echo "::error::git grep exited $RC — the GS-1 scan did NOT run. This is not a pass."
            exit 1
          fi
          if [ -n "$BAD" ]; then
            echo "::error::Found raw Cache::(put|remember|rememberForever|forget|add) call(s) outside the cache-services allowlist."
            echo "$BAD"
            echo ""
            echo "Use a method on a *CacheService (or CacheLockService::rememberLocked) with CacheKeyGenerator for key construction."
            echo "If this is a legitimate exception (webhook idempotency, internal token cache), add the file path to the allowlist in .github/workflows/ci.yml."
            exit 1
          fi
          echo "No raw Cache:: calls outside the GS-1 allowlist."

      - name: No unsafe migration locking patterns (Master Pattern 20)
        if: ${{ !cancelled() && steps.copy_env.outcome == 'success' }}
        run: |
          # Master Pattern 20: migrations added after 2026-05-14 must not use patterns
          # that cause write downtime on populated tables:
          #   - CREATE INDEX without CONCURRENTLY (SHARE lock blocks all writes during build)
          #   - ADD CONSTRAINT FOREIGN KEY without NOT VALID (ACCESS EXCLUSIVE + full scan)
          #   - ALTER COLUMN SET NOT NULL (ACCESS EXCLUSIVE + full scan)
          #   - DDL/DML on a hot table (site.design_kits/sites/blocks, core.users)
          #     without a BEGIN + SET LOCAL lock_timeout (migrations added after
          #     2026-07-11, its own later cutoff — see TIMEOUT_GUARD_CUTOFF)
          #
          # Pre-convention migrations (timestamp <= 20260514100000) are grandfathered.
          # See supabase/migrations/CONVENTIONS.md for the safe alternatives.
          php scripts/guard-no-unsafe-migrations.php

      - name: Launch-check parser regression suite
        if: ${{ !cancelled() && steps.copy_env.outcome == 'success' }}
        # scripts/launch-check/env-check.sh's cloud-payload parser shipped a FALSE
        # PASS twice; this suite pins both PoCs plus the fail-closed cases (absent
        # cloud CLI, absent jq, ungated production). It was previously unwired —
        # an unrun regression test is exactly how the group-H WARN-instead-of-FAIL
        # drift went unnoticed. Plain bash + jq (both present on ubuntu-latest),
        # no bats; a non-zero exit fails the build.
        run: bash scripts/launch-check/env-check-parser.test.sh

      - name: Run tests
        if: ${{ !cancelled() && steps.copy_env.outcome == 'success' }}
        run: composer test

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans full history — a key committed months ago is still live
          # Scheduled runs execute from the DEFAULT branch (production — stale).
          # Pin the audited code to development, the branch that's actually
          # deployed. Empty string = checkout's normal event-ref behaviour.
          ref: ${{ github.event_name == 'schedule' && 'development' || '' }}

      - name: Dependency advisories (composer audit)
        # --locked audits composer.lock against the Packagist advisory DB without
        # a vendor install; the runner's preinstalled PHP/composer suffice. Plain
        # `composer audit` errors ("No installed packages found") when vendor is
        # absent, which is why this job skips install but must pass --locked.
        run: composer audit --locked

      - name: Secret scan (gitleaks, full history)
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          # Uses the repo-root .gitleaks.toml (default ruleset + path allowlist for test/doc/log fixtures).
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (cloudflare-worker)
        working-directory: cloudflare-worker
        # --omit=dev: the Worker's only dependency is wrangler (devDependency),
        # a build/deploy tool that is never bundled into the deployed Worker.
        # Its transitive sharp/libvips CVEs (via miniflare) can't reach the
        # Worker runtime and have no non-breaking fix (every wrangler >=4.16.0
        # pulls the flagged miniflare). Audit what actually ships.
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (repo root)
        # Root package.json (Vite build tooling) was previously unaudited —
        # Checkpoint caught 2 critical CVEs here 2026-07-19.
        run: npm audit --audit-level=high

  # Cloudflare Worker test lane (cloudflare-worker/test/, vitest + the Miniflare
  # programmatic API). The Worker is the public wire for 100% of
  # <handle>.partna.au traffic and had zero tests before 2026-07-30.
  #
  # Its own job, NOT a step appended to supply-chain: that job has a `schedule`
  # trigger, `fetch-depth: 0`, and on scheduled runs checks out `development`
  # regardless of ref — all wrong for a code test, which must run against the ref
  # under review.
  #
  # No `paths:` filter, deliberately. A path-filtered required check does not run
  # at all when the filter misses, and GitHub renders a skipped required check as
  # green — the guard would silently stop guarding.
  worker-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22, not the 20 used by supply-chain: both miniflare and wrangler
          # declare `engines: node >= 22`, so the suite cannot run on 20.
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        working-directory: cloudflare-worker
        run: npm ci

      - name: Worker tests (vitest + Miniflare)
        working-directory: cloudflare-worker
        # Runs the real src/index.js inside workerd. No network egress: the
        # harness stubs both the PARTNA_PAGES service binding and, critically,
        # `outboundService` — without the latter, passThrough()'s plain fetch()
        # would make real requests to https://api.partna.au from CI.
        run: npm test

  # Cloudflare Worker static analysis (types, typecheck, lint, format). The
  # Worker is the public wire for 100% of <handle>.partna.au traffic and had no
  # static analysis of any kind before 2026-08-03 — npm audit checks its
  # dependencies, DAST probes the deployed edge, neither reads the source.
  #
  # Its own job, NOT steps appended to worker-tests: a type error and a failing
  # behavioural test are different signals, and appending would let a test
  # failure mask the static result.
  #
  # No `paths:` filter, deliberately — same reasoning as worker-tests: GitHub
  # renders a skipped required check as green, so a filtered guard silently
  # stops guarding.
  worker-static:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22 to match worker-tests: wrangler declares engines node >= 22.
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        working-directory: cloudflare-worker
        run: npm ci

      - name: Workers types are in sync with wrangler.toml
        working-directory: cloudflare-worker
        # Regenerate-and-diff, NOT `wrangler types --check`: that flag compares
        # only the config-hash comment on line 2 and passes even when the file
        # has been truncated to two lines (verified against wrangler 4.112.0).
        #
        # Deterministic because npm ci pins wrangler via the committed lockfile.
        # A wrangler bump changes the generated runtime types and turns this red
        # until regenerated and committed — expected, not a broken gate.
        run: |
          npm run types
          git diff --exit-code -- worker-configuration.d.ts

      - name: Typecheck (tsc --noEmit, checkJs + strict)
        working-directory: cloudflare-worker
        run: npm run typecheck

      - name: Lint (typescript-eslint, type-aware)
        working-directory: cloudflare-worker
        run: npm run lint

      - name: Format check (biome)
        working-directory: cloudflare-worker
        run: npm run format:check

  # Real-Postgres regression lane (tests/Postgres/, see tests/PostgresTestCase.php).
  # `composer test` never reaches these — the Postgres-gated sentinels there
  # (e.g. ItemSlugAllocatorRegressionTest, guarding the SQLSTATE 25P02
  # transaction-abort fix in 3cd4ff63) need real Postgres transaction-abort
  # semantics that SQLite cannot reproduce. This job runs them against an
  # actual postgres:16 service container instead. Independent of Supabase —
  # the tests self-provision (and drop) their own tables, no migrations run.
  postgres-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: partna_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # The service container below has no SSL configured — config/database.php
      # defaults DB_SSLMODE to 'require', which would refuse to connect.
      DB_SSLMODE: disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: partna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, redis
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy env
        run: cp .env.example .env && php artisan key:generate

      - name: Run Postgres regression lane
        run: composer test:pg

  # Applied-schema lane. Distinct from postgres-tests above: THAT job runs
  # against a bare container whose tests provision their own tables, because it
  # tests Postgres BEHAVIOUR. This one applies the real supabase/migrations/ set
  # and then asks pg_constraint whether the CHECK constraints and FKs those
  # migrations are supposed to create actually exist and are actually VALIDATED.
  #
  # It exists because tests/Schema/CheckConstraintsTest.php ran in NO lane at
  # all. It sat in tests/Feature gating itself on "is this connection Postgres?",
  # and Tests\TestCase::setUp() repoints 'pgsql' at in-memory SQLite
  # unconditionally — so all 22 assertions skipped silently, forever, while the
  # file described itself as the safety net for un-applied migrations.
  #
  # The apply step is load-bearing beyond the tests: a from-zero apply of every
  # migration is itself a thing CLAUDE.md warns can silently break, so a
  # migration that cannot be applied to an empty database now fails a build the
  # day it lands rather than at the next fresh-environment cutover.
  schema-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: partna_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Service container has no SSL; config/database.php defaults to 'require'.
      DB_SSLMODE: disable
      # Preconditions are MANDATORY here. Without this the lane would skip when
      # the apply step failed and the build would stay green — reproducing the
      # exact false-safety-net this job was created to remove.
      SCHEMA_LANE_REQUIRED: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: partna_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: partna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Needed by the authorization lane, not the schema lane. phpunit.authz.xml
      # pins CACHE_STORE/SESSION_DRIVER/QUEUE_CONNECTION to array|sync, so the
      # only component still reaching for a real Redis is session revocation
      # (SessionController@destroy -> listSessionsForUser). Without this service
      # that route answers 500 instead of 404 and the matrix reports an
      # application defect that is really a missing dependency.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, redis
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy env
        run: cp .env.example .env && php artisan key:generate

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply every migration from zero
        run: scripts/db/apply-migrations.sh

      - name: Run applied-schema lane
        run: composer test:schema

      # Authorization matrix (tests/Authz/). Runs against the same migrated
      # database the step above provisioned — the expensive from-zero apply is
      # already paid for, so this costs only the requests themselves.
      #
      # AUTHZ_LANE_REQUIRED=1 makes a missing precondition a RED build rather
      # than a silent skip, the same contract SCHEMA_LANE_REQUIRED has and for
      # the same reason: a lane that stands down quietly when its database is
      # absent reports green while testing nothing.
      - name: Run authorization lane
        if: ${{ !cancelled() }}
        env:
          AUTHZ_LANE_REQUIRED: '1'
        run: composer test:authz

  # The schema-drift gate lives in the Feature suite, which `composer test` runs
  # AFTER the Unit suite. A single unrelated Unit-suite fatal would abort the run
  # before the gate ever executes — silently disabling the guardrail. Running it
  # in its own job isolates the gate so it always fires (and can fail on real drift)
  # regardless of the rest of the suite's health.
  schema-drift:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: testing
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, redis
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy env
        run: cp .env.example .env && php artisan key:generate

      - name: Schema-drift gate
        run: php artisan test --filter=SchemaDriftGuardTest

  # Outbound-HTTP guard. Same reasoning as schema-drift above: this lives in the
  # Feature suite, which `composer test` runs AFTER the Unit suite, so a single
  # unrelated Unit-suite fatal would abort the run before the gate ever executes
  # — silently disabling it. `composer test` is also red for unrelated reasons
  # more often than anyone would like. It still runs there (so a violation is
  # caught before push); this job guarantees it runs at all.
  #
  # No service containers: the guard only reads source files with
  # token_get_all(), so it needs neither a database nor Redis.
  # Spec: docs/superpowers/specs/2026-07-30-outbound-http-guard-design.md
  outbound-http-guard:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy env
        run: cp .env.example .env && php artisan key:generate

      - name: Outbound HTTP guard (SSRF sanitizer enforcement)
        run: php artisan test --filter=OutboundHttpGuardTest

  # Checkpoint suppression staleness. Same "own job" reasoning as the two guards
  # above — it lives in the Feature suite, which aborts before reaching it if
  # anything earlier fatals.
  #
  # It is a SEPARATE concern from the `Security scan (Checkpoint)` step in `test`:
  # that step fails when a NEW finding appears; this one fails when an EXISTING
  # suppression stops matching anything. Neither catches the other's case, and the
  # second had gone undetected three times by 2026-07-31 — twice from an edit that
  # re-hashed a finding, once from a deleted file.
  #
  # No service containers, and no network: the test disables ComposerAuditCheck and
  # NpmAuditCheck (which shell out to Packagist / the npm registry) so an upstream
  # advisory appearing cannot flip it red on an unrelated commit.
  checkpoint-suppressions:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy env
        run: cp .env.example .env && php artisan key:generate

      - name: Checkpoint suppression staleness guard
        run: php artisan test --filter=CheckpointSuppressionStalenessTest
