name: CI

on:
  pull_request:
    branches: [main, development-v2, development]
  push:
    branches: [main, development]
  schedule:
    # Weekly dependency-advisory check (Sun 20:00 UTC = Mon ~6am AEST). New CVEs
    # land against an unchanged composer.lock/package-lock.json, so push-triggered
    # CI alone misses them during quiet weeks. Only the supply-chain job runs on
    # this trigger — test/schema-drift are code-driven and skip it.
    # NOTE: GitHub registers cron triggers from the DEFAULT branch's copy of this
    # file, so this block must exist on that branch to fire at all.
    - cron: '0 20 * * 0'

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Locked to least-privilege — add per-step permissions explicitly if a future step needs the token.

    env:
      # `composer install` runs package:discover (post-autoload-dump), which boots
      # the app BEFORE the "Copy env" step creates .env. Without APP_ENV, Laravel
      # defaults to production and AppServiceProvider's F2 AUTH-1 guard aborts the
      # boot because SUPABASE_JWT_ISSUER is unset. Declaring CI as testing takes the
      # guard's local/testing exemption. The test run already uses testing (phpunit.xml).
      APP_ENV: testing

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Security audit
        run: composer audit

      - name: Copy env
        run: cp .env.example .env && php artisan key:generate

      - name: Static analysis (PHPStan level 5)
        run: composer analyse

      - name: Security scan (Checkpoint)
        # False positives are suppressed by hash in config/checkpoint.php. FAIL
        # (not WARN) breaks the build — see ScanCommand::outputTable in
        # vendor/andreapollastri/checkpoint.
        run: php artisan checkpoint:scan

      - name: Security audit (Vigil)
        # env-dependent checks (APP_DEBUG, headers) are only meaningful on the
        # deployed env; this CI gate covers filesystem/secrets/dependency checks.
        # APP_DEBUG=false neutralises the synthetic CI .env (.env.example already
        # defaults to false, but this keeps the gate correct if that ever drifts).
        run: APP_DEBUG=false php artisan vigil:audit --fail-on=critical

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Check for inline auth bypasses in controllers
        run: |
          # Inline 403 aborts in controllers bypass the Policy layer — use authorizeForUser() instead.
          # Pattern catches abort(403, ...), abort_unless(..., 403, ...), abort_if(..., 403, ...).
          # If the abort is actually input validation (stale IDs etc.), use abort(422, ...) — see the bulk-id reorder pattern in ProfessionalServiceController for precedent.
          INLINE_403=$(grep -rE "abort\(403|abort_unless|abort_if" app/Http/Controllers/ | grep "403" | wc -l | tr -d ' ')

          if [ "$INLINE_403" -gt 0 ]; then
            echo "::error::Found $INLINE_403 inline 403 abort(s) in controllers. Use a Policy via authorizeForUser() for authorization, or abort(422, ...) if it's really input validation."
            grep -rEn "abort\(403|abort_unless|abort_if" app/Http/Controllers/ | grep "403"
            exit 1
          fi

          echo "No inline auth bypasses found."

      - name: No raw Cache::* calls outside cache services (GS-1)
        run: |
          # GS-1: Cache keys must flow through CacheKeyGenerator and a *CacheService
          # to preserve tenant-prefix discipline. A rogue Cache::put('user_count', $n)
          # in a controller is one git push away from a cross-tenant data leak — this
          # lint blocks that class of bug before it reaches review.
          #
          # Allowlisted by path:
          #   - app/Services/Cache/                  — the canonical cache layer itself
          #   - app/Http/Controllers/Api/Webhooks/   — Cache::add() for idempotency dedupe
          #   - pre-existing legitimate callers      — file-level entries below.
          # New code MUST route through a cache service. To add a new exception,
          # justify it in PR review and append the path here.
          #
          # File-level exceptions (audited 2026-06-12 — the guard shipped while CI
          # was failing at the pint step, so these pre-existing callers were never
          # caught; each is a deliberate pattern, not a tenant-key leak):
          #   - CustomerObserver            — Cache::forget via CacheKeyGenerator; direct invalidation in observer, no service injection point
          #   - SupabaseEmailHookController — Cache::add SETNX webhook dedupe + Cache::forget rollback on send failure
          #   - InstagramController         — refresh budget + cooldown via atomic Cache::add (comments also match the grep)
          #   - ShopController              — short-lived picker-catalog cache, keys via CacheKeyGenerator
          #   - IndividualProfileController — docblock mention only (grep matches the comment)
          #   - IdempotencyKey middleware   — the idempotency exception the error copy itself names
          #   - LogLeadRateLimits           — Cache::add SETNX dedupe of auto-retry log bursts
          #   - SendFeedbackEmailJob        — job idempotency SETNX + rollback
          #   - AnalyticsCacheService       — IS a *CacheService, just lives under Services/Analytics/
          #   - AnalyticsDedupGuard         — atomic SETNX fixed-window dedup utility
          #   - FeatureFlagService          — flag registry/per-pro invalidation (Cache::forget)
          #   - YoutubeThumbnailResolver    — thumbnail-tier memo with jittered TTL
          #   - AppleSearch                 — iTunes API response cache, key via CacheKeyGenerator (same pattern as YoutubeThumbnailResolver)
          #   - RefreshController           — Cache::add SETNX per-user refresh cooldown (key is user+platform scoped)
          #   - DispatchEnquiryNotificationsJob — Cache::put notify-once idempotency guard (enquiry-id scoped)
          # File-level exceptions (audited 2026-07-22 — same story: the whole gate
          # chain after composer audit was masked, so these pre-existing callers were
          # never caught until the chain was fixed. Each key is scoped/content-addressed
          # — vetted, not a tenant leak):
          #   - StaffAggregateAnalyticsController — staff-only aggregate; key encodes the full scope (all|segment-hash)+window; cross-tenant BY DESIGN (staff see all), so tenant isolation is N/A
          #   - GoogleBusinessEnrichJob     — paid-Apify inflight/result guard, keys via CacheKeyGenerator::googleBusinessApify*(userId, placeId) (same pattern as InstagramController)
          #   - OwnMediaAccentFactor        — content-addressed memo (key = md5 of image URL); value is a non-sensitive computed hex colour
          #   - StorePricePointFactor       — site-scoped streak key (design:store-price-streak:<site_id>)
          #   - AccountDeletionService      — Cache::forget of the user's OWN idempotency keys (enumerated from idempotencyIndexKey(authUserId)) during account teardown
          # File-level exceptions (audited 2026-07-25 — same story a third time: all
          # three landed while CI was red at PHPStan/Checkpoint, so GS-1 never ran
          # on them. Each key is scoped/content-addressed — vetted, not a leak):
          #   - DedupesRecipientSends       — RV-10 per-recipient Cache::add SETNX claim + Cache::forget rollback; key is action-log-scoped and content-addressed (sha256 of "<actionLogId>|<recipient>"), same pattern as SendFeedbackEmailJob
          #   - MenuApifyScraper            — negative-cache "blocked/hard_error" marker + its recovery forget, key via CacheKeyGenerator::menuScrapeBlocked(platform, url) (same shape as YoutubeThumbnailResolver/AppleSearch)
          #   - ShopBrandSeeder             — picker-catalog warm mirroring addBrand()'s, key via CacheKeyGenerator::shopifyBrandCatalog($id); ShopController is already allowlisted for this exact cache
          set +e
          BAD=$(git grep -n -E '\bCache::(put|remember|rememberForever|forget|add)\b' -- \
            'app/' \
            ':!app/Services/Cache/' \
            ':!app/Http/Controllers/Api/Webhooks/' \
            ':!app/Http/Controllers/Api/HealthController.php' \
            ':!app/Observers/Core/CustomerObserver.php' \
            ':!app/Http/Controllers/Api/Internal/SupabaseEmailHookController.php' \
            ':!app/Http/Controllers/Api/Platforms/InstagramController.php' \
            ':!app/Http/Controllers/Api/Platforms/ShopController.php' \
            ':!app/Http/Controllers/Api/PublicSite/IndividualProfileController.php' \
            ':!app/Http/Middleware/IdempotencyKey.php' \
            ':!app/Http/Middleware/Logging/LogLeadRateLimits.php' \
            ':!app/Jobs/Notifications/SendFeedbackEmailJob.php' \
            ':!app/Services/Analytics/AnalyticsCacheService.php' \
            ':!app/Services/Analytics/AnalyticsDedupGuard.php' \
            ':!app/Services/FeatureFlags/FeatureFlagService.php' \
            ':!app/Http/Controllers/Api/Platforms/RefreshController.php' \
            ':!app/Jobs/Notifications/DispatchEnquiryNotificationsJob.php' \
            ':!app/Services/Platforms/YoutubeThumbnailResolver.php' \
            ':!app/Services/Platforms/AppleSearch.php' \
            ':!app/Http/Controllers/Api/Staff/Analytics/StaffAggregateAnalyticsController.php' \
            ':!app/Jobs/Platforms/GoogleBusinessEnrichJob.php' \
            ':!app/Services/Design/Presets/Factors/OwnMediaAccentFactor.php' \
            ':!app/Services/Design/Presets/Factors/StorePricePointFactor.php' \
            ':!app/Services/User/AccountDeletionService.php' \
            ':!app/Jobs/Moderation/Concerns/DedupesRecipientSends.php' \
            ':!app/Services/Platforms/MenuApifyScraper.php' \
            ':!app/Services/Platforms/ShopBrandSeeder.php')
          set -e
          if [ -n "$BAD" ]; then
            echo "::error::Found raw Cache::(put|remember|rememberForever|forget|add) call(s) outside the cache-services allowlist."
            echo "$BAD"
            echo ""
            echo "Use a method on a *CacheService (or CacheLockService::rememberLocked) with CacheKeyGenerator for key construction."
            echo "If this is a legitimate exception (webhook idempotency, internal token cache), add the file path to the allowlist in .github/workflows/ci.yml."
            exit 1
          fi
          echo "No raw Cache:: calls outside the GS-1 allowlist."

      - name: No unsafe migration locking patterns (Master Pattern 20)
        run: |
          # Master Pattern 20: migrations added after 2026-05-14 must not use patterns
          # that cause write downtime on populated tables:
          #   - CREATE INDEX without CONCURRENTLY (SHARE lock blocks all writes during build)
          #   - ADD CONSTRAINT FOREIGN KEY without NOT VALID (ACCESS EXCLUSIVE + full scan)
          #   - ALTER COLUMN SET NOT NULL (ACCESS EXCLUSIVE + full scan)
          #   - DDL/DML on a hot table (site.design_kits/sites/blocks, core.users)
          #     without a BEGIN + SET LOCAL lock_timeout (migrations added after
          #     2026-07-11, its own later cutoff — see TIMEOUT_GUARD_CUTOFF)
          #
          # Pre-convention migrations (timestamp <= 20260514100000) are grandfathered.
          # See supabase/migrations/CONVENTIONS.md for the safe alternatives.
          php scripts/guard-no-unsafe-migrations.php

      - name: Run tests
        run: composer test

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans full history — a key committed months ago is still live
          # Scheduled runs execute from the DEFAULT branch (production — stale).
          # Pin the audited code to development, the branch that's actually
          # deployed. Empty string = checkout's normal event-ref behaviour.
          ref: ${{ github.event_name == 'schedule' && 'development' || '' }}

      - name: Dependency advisories (composer audit)
        # --locked audits composer.lock against the Packagist advisory DB without
        # a vendor install; the runner's preinstalled PHP/composer suffice. Plain
        # `composer audit` errors ("No installed packages found") when vendor is
        # absent, which is why this job skips install but must pass --locked.
        run: composer audit --locked

      - name: Secret scan (gitleaks, full history)
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          # Uses the repo-root .gitleaks.toml (default ruleset + path allowlist for test/doc/log fixtures).
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (cloudflare-worker)
        working-directory: cloudflare-worker
        # --omit=dev: the Worker's only dependency is wrangler (devDependency),
        # a build/deploy tool that is never bundled into the deployed Worker.
        # Its transitive sharp/libvips CVEs (via miniflare) can't reach the
        # Worker runtime and have no non-breaking fix (every wrangler >=4.16.0
        # pulls the flagged miniflare). Audit what actually ships.
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (repo root)
        # Root package.json (Vite build tooling) was previously unaudited —
        # Checkpoint caught 2 critical CVEs here 2026-07-19.
        run: npm audit --audit-level=high

  # Real-Postgres regression lane (tests/Postgres/, see tests/PostgresTestCase.php).
  # `composer test` never reaches these — the Postgres-gated sentinels there
  # (e.g. ItemSlugAllocatorRegressionTest, guarding the SQLSTATE 25P02
  # transaction-abort fix in 3cd4ff63) need real Postgres transaction-abort
  # semantics that SQLite cannot reproduce. This job runs them against an
  # actual postgres:16 service container instead. Independent of Supabase —
  # the tests self-provision (and drop) their own tables, no migrations run.
  postgres-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: partna_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # The service container below has no SSL configured — config/database.php
      # defaults DB_SSLMODE to 'require', which would refuse to connect.
      DB_SSLMODE: disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: partna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, redis
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy env
        run: cp .env.example .env && php artisan key:generate

      - name: Run Postgres regression lane
        run: composer test:pg

  # The schema-drift gate lives in the Feature suite, which `composer test` runs
  # AFTER the Unit suite. A single unrelated Unit-suite fatal would abort the run
  # before the gate ever executes — silently disabling the guardrail. Running it
  # in its own job isolates the gate so it always fires (and can fail on real drift)
  # regardless of the rest of the suite's health.
  schema-drift:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: testing
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, redis
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy env
        run: cp .env.example .env && php artisan key:generate

      - name: Schema-drift gate
        run: php artisan test --filter=SchemaDriftGuardTest
