name: DAST active lane

# The active lane — ZAP fuzzing an isolated, runner-owned Supabase stack, plus
# the Tier 2 auth probes and the cross-identity IDOR pass (scripts/dast/README.md).
# Until 2026-08-10 it ran ONLY when a human remembered to run it, which for a
# ~12-18 minute manual job means "rarely, and not after the changes that matter".
#
# ─── THE DEFAULT-BRANCH TRAP — READ BEFORE EDITING `on:` OR `env:` ───────────
#
# GitHub takes a scheduled workflow's `schedule:` trigger AND ITS ENTIRE FILE,
# including `env:`, from the DEFAULT branch. Only the checked-out *content* comes
# from `ref:`. The default branch here is `production`, which is several hundred
# commits behind `development`.
#
# CONSEQUENCE, and it is worse than the schedule alone — VERIFIED 2026-08-10, not
# reasoned about. Until this file exists on `production`:
#
#   * `schedule:`        does NOT fire.
#   * `workflow_dispatch:` is NOT dispatchable. `gh workflow run dast-active.yml
#     --ref development` returns **HTTP 404: workflow not found on the default
#     branch**, and the Actions UI does not offer a "Run workflow" button either.
#     The `--ref` is which branch to RUN, not where the workflow may live.
#   * `pull_request:`    DOES work — a PR's workflows are read from the PR branch.
#
# So the PR path filter is the ONLY live trigger today, and it is the one this
# lane most wants anyway: it fires on exactly the auth-adjacent diffs that break
# it. Do not read a quiet Actions tab as "the lane is watching"; until this file
# is on production, nothing scheduled and nothing manual will start it.
#
# This is not hypothetical — dast-edge.yml is living proof. Its cron gates at
# `high` because production's copy of that file says so, while development's says
# `medium`, so a green Sunday there does not mean "clean at medium".
#
# HOW THIS IS HANDLED: the same way the edge lane's `env:` correction is —
# it rides along on the next production ship rather than pushing to prod for a
# workflow file (prod has usesPushToDeploy: true, so a push IS a deploy, with no
# CI gate; correcting one line would ship several hundred commits). Until then
# the lane is dispatch- and PR-triggered, which is the majority of its value: it
# fires on the diffs that can break it. Verify after the next prod ship with
#   gh run list --workflow dast-active.yml
# and if the list is empty of scheduled runs, this file has not reached production
# yet. docs/deploy/routine-deploy.md carries it as a checklist item.
on:
  schedule:
    # Sunday 04:00 UTC — twelve hours off the edge lane's 16:00 UTC cron so the
    # two never contend for a runner, and clear of the 15:00 UTC weekly DB backup.
    - cron: '0 4 * * 0'

  workflow_dispatch: {}

  # Path-filtered and NON-BLOCKING. These are the inputs that break this lane:
  # policies and auth middleware are what the IDOR pass exists to test; route
  # changes rename the probe targets; and supabase/migrations/** matters more
  # than it looks — a column change breaks seed-identities.php, and today that
  # stays invisible until someone runs the lane by hand and misreads the failure.
  pull_request:
    paths:
      - 'app/Policies/**'
      - 'app/Http/Middleware/Auth/**'
      - 'routes/api/**'
      - 'supabase/migrations/**'
      - 'scripts/dast/**'
      - '.github/workflows/dast-active.yml'

jobs:
  active-scan:
    runs-on: ubuntu-latest
    # NOT A REQUIRED CHECK, deliberately. `supabase start` is documented-flaky —
    # bring-up.sh already retries it 3x and dies loudly on the third — and a flaky
    # required gate trains people to bypass gates, which is worse than no gate.
    #
    # NON-BLOCKING IS ENFORCED BY LEAVING THIS JOB OUT OF BRANCH PROTECTION, NOT BY
    # `continue-on-error`. That distinction is load-bearing and was learned the
    # expensive way on 2026-08-10: this job originally carried
    # `continue-on-error: true`, and when run 31375156868 died one second in
    # ("ZAP_TARGET_LOCAL: unbound variable"), `gh run list` reported the run as
    # **completed / success**. A lane that never started, reporting green.
    #
    # That is the exact failure shape this whole tool exists to eliminate — the
    # same shape as the months of PASS-while-unauthenticated in 71f027b11. A
    # non-required job that FAILS is honest and still blocks nothing, because what
    # makes a check blocking is branch protection, not the job's exit status.
    #
    # So: no `continue-on-error`. If this job goes red, believe it. If it is flaky
    # in practice, fix the flake or drop the trigger — do not restore a flag that
    # relabels failure as success.
    # RUNTIME IS MACHINE-DEPENDENT — budget generously, then measure.
    #
    # Measured on the 2026-08-10 LOCAL run (file mtimes, see scripts/dast/README.md
    # for the full table): bring-up ~1 min, seed + Tier 2 ~8s, the ZAP plan 9m09s,
    # teardown + baseline diff + REPORT.md ~12 min — 22m17s total.
    #
    # Correcting an earlier version of this comment, which said that run took ~2
    # hours and blamed passive-scan queue draining between ZAP jobs: both were
    # wrong. The jobs sum to 9m01s against a 9m09s span, so there is no meaningful
    # inter-job idle, and the total was 22 minutes. The mistake came from reading
    # elapsed time off a polling loop rather than off the artefacts.
    #
    # 180 is still deliberately generous, for reasons that survive the correction:
    # a hosted runner pulls ~12 Supabase images plus ZAP COLD and has weaker CPU
    # than the laptop those numbers came from, and a job killed mid-scan looks
    # exactly like a hang — the first response to which is to disable it. Tighten
    # only once several hosted runs show a real distribution.
    #
    # This is a private repo, so Actions minutes are billed — which is why there is
    # no push trigger and the PR trigger is path-filtered rather than firing on
    # every commit.
    timeout-minutes: 180
    permissions:
      contents: read

    # REDIS IS A HARD DEPENDENCY OF THE LANE, which nothing said until the lane
    # ran somewhere without one. bring-up.sh sets CACHE_STORE/SESSION_DRIVER=array
    # and QUEUE_CONNECTION=sync so the scan needs no Redis for cache, sessions or
    # jobs — but that does NOT cover auth. TokenRevocationService writes its
    # `auth:revoked-session:` / `auth:user-sessions:` keyspace on the `app`
    # connection for EVERY authenticated request (CLAUDE.md, Cache/Queue row), and
    # that path fails closed.
    #
    # On run 31378563351 the absence showed up as three Tier 2 failures that named
    # the wrong thing: `require.aal2` on /api/staff/me returned 503 "Service
    # temporarily unavailable" instead of 401, and the claim race produced zero
    # winners. Both read like auth or locking regressions; both were just no Redis.
    #
    # It worked locally for the same reason the missing .env did — a developer
    # machine happens to have one running. Same image and health-check as ci.yml.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled runs execute from the DEFAULT branch (production — stale);
          # pin the CONTENT to development. Same reasoning as dast-edge.yml and
          # ci.yml's supply-chain job. Note this does NOT rescue the `env:`/`on:`
          # blocks above — see the header.
          ref: ${{ github.event_name == 'schedule' && 'development' || '' }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # pdo_pgsql is required twice over: the served app talks to the scratch
          # stack, and bring-up.sh issues the app_backend LOGIN grant through PDO
          # rather than psql (not present on the macOS box this lane is developed
          # on, and shelling into the container would hardcode a CLI-owned name).
          extensions: pdo, pdo_pgsql, pgsql

      - name: Install dependencies
        # APP_ENV: package:discover boots the app during install, before any .env
        # exists; without this Laravel defaults to production and AppServiceProvider's
        # AUTH-1 guard aborts the boot. Same reason ci.yml sets it.
        env:
          APP_ENV: testing
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # PINNED, and `latest` was actively wrong here — twice over.
          #
          # 1. It makes this lane's behaviour change with no commit. A CLI release
          #    can break the run on a Tuesday with an empty diff, which is the
          #    worst possible signal from a security gate.
          # 2. It DID. Run 31375949918 failed applying
          #    20260727110001_connections_surface_key_backfill.sql with
          #    `ERROR: invalid transaction termination (SQLSTATE 2D000)`. That
          #    migration COMMITs inside a DO block — deliberately, per
          #    supabase/migrations/CONVENTIONS.md §5, which forbids backfilling
          #    inside the DDL transaction. A current CLI wraps migration
          #    application in a transaction, so the COMMIT is illegal; 2.101.0
          #    (what this repo is developed against) does not.
          #
          # 2.101.0 is the version the local lane is green on, and the version
          # scripts/dast/README.md already cites for the jwt_expiry check.
          #
          # ⚠️ THE PIN IS NOT A FIX — but the exposure is NARROWER than 333f0c7e7's
          # commit message claimed, and that claim is corrected here. It said
          # scripts/db/fresh-reset.sh and the prod cutover break on a CLI upgrade.
          # They do NOT: both deliberately bypass the CLI's migration applier and
          # go through psql directly, so nothing wraps the file in a transaction
          # and the COMMIT stays legal.
          #   * fresh-reset.sh applies each file via `docker exec ... psql` in a
          #     loop (its header explains why — the CLI's pipeline applier cannot
          #     handle CONCURRENTLY).
          #   * the prod cutover path in CLAUDE.md uses `psql -f`, explicitly NOT
          #     --single-transaction.
          #
          # What IS exposed is provisioning a fresh environment THROUGH THE CLI —
          # `supabase db reset` / `supabase start` (this lane) and a from-zero
          # `supabase db push`. Re-pushing to an existing dev/prod is unaffected,
          # since already-applied migrations are skipped.
          #
          # So: a fresh-environment-via-CLI problem, not a disaster-recovery one.
          # Still worth resolving — on a from-zero apply the table is empty, so
          # the batching loop the COMMIT exists to serve does nothing, and a plain
          # UPDATE would be identical in outcome and portable across CLI versions.
          # Left as a finding rather than done here: it edits an already-applied
          # migration, which is Josh's call, not a drive-by.
          version: 2.101.0

      # No secrets. Unlike the edge lane, the active lane is entirely local: it
      # provisions its own throwaway stack on a port offset and tears it down via
      # `trap`. If a future edit here needs a secret, something has gone wrong —
      # most likely the lane has been pointed at a real environment, which is the
      # one thing scripts/dast/README.md says it must never do.
      - name: Run active lane
        run: scripts/dast/run.sh --only active

      - name: Attach REPORT.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-active-report
          path: audits/dast/*/REPORT.md
          retention-days: 90

      # The interesting artefact when this fails is not the report — it is the ZAP
      # run log and the bring-up/serve logs, which carry the control-vs-probe
      # status codes and the Supabase start failures. A CI failure with no way to
      # tell a flaky `supabase start` from a real authorization regression is a
      # failure people learn to ignore.
      - name: Attach run logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dast-active-logs
          path: |
            audits/dast/*/zap/zap-run.log
            audits/dast/*/zap/zap-plan.yaml
            audits/dast/*/serve.log
            audits/dast/*/supabase-start.log
            audits/dast/*/bring-up-stdout.log
            audits/dast/*/tier2.md
            # Seeding artefacts. Added after run 31378078269 died 0.2s into
            # seeding with NO message: `artisan route:list`'s stdout goes into
            # routes-raw.json, so its boot error landed in the JSON file rather
            # than the log. seed-endpoints.sh now surfaces that itself, and these
            # two make the next seeding failure diagnosable without a code change.
            audits/dast/*/route-list-stderr.log
            audits/dast/*/routes-raw.json
          retention-days: 30
