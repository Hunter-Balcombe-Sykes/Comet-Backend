; Test-gate speedup (2026-09-01): CLI opcache + tracing JIT for the parallel
; suite. Loaded ONLY when PHP_INI_SCAN_DIR appends this directory, e.g.:
;   PHP_INI_SCAN_DIR=":$PWD/scripts/testing" php artisan test --parallel
; The leading colon keeps the system scan dir; paratest workers inherit the
; env, so every worker gets the cache. Never loaded by the web runtime.
opcache.enable_cli=1
opcache.jit=tracing
opcache.jit_buffer_size=128M
opcache.memory_consumption=512
opcache.max_accelerated_files=50000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
