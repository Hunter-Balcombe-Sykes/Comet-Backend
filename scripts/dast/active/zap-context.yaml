# Active lane: ZAP automation-framework context + replacer definitions for
# the three passes — context A (token A), context B (token B), and unauth
# (no Authorization header). This is a TEMPLATE, not a runnable plan on its
# own: __TARGET_URL__, __TOKEN_A__, __TOKEN_B__ are substituted by
# active/zap-active.sh (Phase 4) with the live bring-up.sh base URL and
# freshly-minted tokens before being merged with the actual scan jobs
# (import/spider/activeScan/report) into one automation plan.
#
# The cross-identity IDOR pass (Phase 4) reuses context A's replacer
# (token A) against context B's seeded resource ids — a 200 where 404 is
# expected on a foreign resource is the finding. Verified manually
# 2026-07-26 (see plan Phase 3 done-when) that token A correctly gets 200
# on its own customer resource and 404 (not 403 — matches the app's public
# 404-not-403 convention) on identity B's, both via ZAP's own proxy with
# this exact replacer mechanism, not just direct curl.

# External-side-effect exclusions (Phase 4 Step 1) — the served app runs
# QUEUE_CONNECTION=sync, so any un-excluded mutating route runs its jobs
# INLINE during the request. Exclude ONLY routes whose handlers reach past
# the local box (plan's inversion — ordinary mutation against the
# throwaway scratch DB is free and desired). Each entry: why.
#   - api/platforms/.* (227 routes) — connect/refresh external providers
#     (Instagram/GBP/Fresha/etc via Apify, Google Places, OAuth). Real
#     third-party API calls with real (if uncapped) cost.
#   - api/staff/builds.* — StaffPreAccountBuildController dispatches a real
#     claim-notification send. PARTNA_NOTIFICATIONS_EMAIL_ENABLED=false and
#     MAIL_MAILER=log (bring-up.sh) already fail this closed at the
#     transport layer — excluded anyway for defense-in-depth per the plan.
#   - api/site/custom-domain.* — CloudflarePurgeService's SaaS custom-domain
#     provisioning calls Cloudflare's real API (CLOUDFLARE_SAAS_API_TOKEN).
#   - api/me/site/reclaim-handle, api/staff/sites/.* — handle/subdomain
#     rename triggers SyncSubdomainToKvJob (SiteObserver/UserObserver on a
#     dirty subdomain/handle) — the ONLY KV writer (CLAUDE.md) — a real
#     Cloudflare KV write from a "local" scan.
env:
  contexts:
    - name: "identity-a"
      urls: ["__TARGET_URL__"]
      excludePaths:
        - ".*api/platforms/.*"
        - ".*api/staff/builds.*"
        - ".*api/site/custom-domain.*"
        - ".*api/me/site/reclaim-handle.*"
        - ".*api/staff/sites/.*"
    - name: "identity-b"
      urls: ["__TARGET_URL__"]
      excludePaths:
        - ".*api/platforms/.*"
        - ".*api/staff/builds.*"
        - ".*api/site/custom-domain.*"
        - ".*api/me/site/reclaim-handle.*"
        - ".*api/staff/sites/.*"
    - name: "unauth"
      urls: ["__TARGET_URL__"]
      excludePaths:
        - ".*api/platforms/.*"
        - ".*api/staff/builds.*"
        - ".*api/site/custom-domain.*"
        - ".*api/me/site/reclaim-handle.*"
        - ".*api/staff/sites/.*"

replacer:
  parameters:
    deleteAllRules: false
  rules:
    - description: "auth-identity-a"
      enabled: true
      matchType: req_header
      matchString: "Authorization"
      replacement: "Bearer __TOKEN_A__"
    - description: "auth-identity-b"
      enabled: false
      matchType: req_header
      matchString: "Authorization"
      replacement: "Bearer __TOKEN_B__"
