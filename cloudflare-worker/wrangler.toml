name = "partna-subdomain-router"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Runs on every *.partna.au request. Specific subdomain DNS records (e.g.,
# brand CNAMEs to shops.myshopify.com) and a wildcard *.partna.au record
# both flow through this Worker.
# `*/*` (not `*.partna.au/*`) is required so the Worker runs on Cloudflare-for-SaaS
# custom hostnames too: Worker Routes see that traffic as the CUSTOMER's hostname
# (e.g. tuesdae.co), not the fallback origin, so only a zone-wide wildcard catches
# it. Per Cloudflare for SaaS "Worker as origin" docs. The worker passes through
# apex / reserved subdomains itself, so the broad pattern is safe.
[[routes]]
pattern = "*/*"
zone_name = "partna.au"

# CFG-1: edge cache TTLs, in seconds. Read in the Worker via
# `Number(env.PRIMARY_CACHE_TTL_S) || <default>` — the module-level default
# is used only if this var is absent or fails to parse. Keep in sync with
# app/Services/Cloudflare/CloudflarePurgeService.php `purgeHandle()` docblock
# (EDGE-3), same as the defaults they mirror.
[vars]
PRIMARY_CACHE_TTL_S = 86_400
STALE_SHADOW_TTL_S = 604_800

# KV namespace holding the subdomain routing table — this is the PRODUCTION
# namespace (used by the default/production deploy).
# Replace `id` with the namespace ID from `wrangler kv:namespace create`.
# `preview_id` is used during `wrangler dev`; create with `--preview`.
[[kv_namespaces]]
binding = "SUBDOMAIN_KV"
id = "ce726607804d41a296d6da150b0c537f"
preview_id = "e6a8eecd305148f9a75b879aa6faf790"

# Service Binding to the partna-pages Astro Worker (plan §16, §29.2).
# Bind name must stay `PARTNA_PAGES` — the router reads
# `env.PARTNA_PAGES.fetch(request)` against this exact identifier.
[[services]]
binding = "PARTNA_PAGES"
service = "partna-pages"
environment = "production"

# EDGE-102: no [env.staging] block. CLAUDE.md documents exactly two backend
# environments — development and production (both served by the SAME Laravel
# Cloud env as of 2026-06-16) — there is no staging environment for this Worker
# to target. The removed block carried unresolved REPLACE_WITH_STAGING_KV_*
# placeholders that would have failed a real `--env staging` deploy anyway. If
# a genuine staging tier is introduced later, re-add the override then with
# real KV namespace ids (EDGE-10's concern — staging must never share the
# production SUBDOMAIN_KV) rather than resurrecting placeholders.
