name = "partna-subdomain-router"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Runs on every *.partna.au request. Specific subdomain DNS records (e.g.,
# brand CNAMEs to shops.myshopify.com) and a wildcard *.partna.au record
# both flow through this Worker.
# `*/*` (not `*.partna.au/*`) is required so the Worker runs on Cloudflare-for-SaaS
# custom hostnames too: Worker Routes see that traffic as the CUSTOMER's hostname
# (e.g. tuesdae.co), not the fallback origin, so only a zone-wide wildcard catches
# it. Per Cloudflare for SaaS "Worker as origin" docs. The worker passes through
# apex / reserved subdomains itself, so the broad pattern is safe.
[[routes]]
pattern = "*/*"
zone_name = "partna.au"

# KV namespace holding the subdomain routing table — this is the PRODUCTION
# namespace (used by the default/production deploy).
# Replace `id` with the namespace ID from `wrangler kv:namespace create`.
# `preview_id` is used during `wrangler dev`; create with `--preview`.
[[kv_namespaces]]
binding = "SUBDOMAIN_KV"
id = "ce726607804d41a296d6da150b0c537f"
preview_id = "e6a8eecd305148f9a75b879aa6faf790"

# Service Binding to the partna-pages Astro Worker (plan §16, §29.2).
# Production wires to the production deployment of partna-pages; staging
# overrides to the staging worker name. Bind name must stay `PARTNA_PAGES`
# — the router reads `env.PARTNA_PAGES.fetch(request)` against this exact
# identifier.
[[services]]
binding = "PARTNA_PAGES"
service = "partna-pages"
environment = "production"

# Staging override — same router code, points at the staging Astro Worker.
[env.staging]
[[env.staging.services]]
binding = "PARTNA_PAGES"
service = "partna-pages-staging"

# EDGE-10: staging MUST NOT share the production SUBDOMAIN_KV — without this
# override a `--env staging` deploy (or a staging backend KV backfill) would
# write into the production routing table and poison prod. Give staging its own
# namespace. TODO(josh): create it and paste the id below —
#   wrangler kv namespace create SUBDOMAIN_KV_STAGING
#   wrangler kv namespace create SUBDOMAIN_KV_STAGING --preview
# then point the STAGING Laravel env's CLOUDFLARE_KV_NAMESPACE_ID at the same id
# so SyncSubdomainToKvJob writes to the staging namespace, not prod.
[[env.staging.kv_namespaces]]
binding = "SUBDOMAIN_KV"
id = "REPLACE_WITH_STAGING_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_STAGING_KV_PREVIEW_ID"
