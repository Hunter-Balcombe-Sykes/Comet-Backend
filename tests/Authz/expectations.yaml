# ── Verified capability gate, not an existence leak ──────────────────────────
# MenuContentController::…  → $this->error('Menu is not available for your
# account.', 403) — the food-business gate. That is a role/type restriction,
# which the project rule explicitly reserves 403 for, and it fires before the
# row is ever consulted so it leaks nothing.
- route: "DELETE api/platforms/menu/categories/{category}"
  expect: 403
  reason: "Food-business capability gate returns 403 before the row is consulted (MenuContentController); a role restriction, not an existence leak."
  fixture: { category: unknown }
- route: "api/platforms/menu/items/{item}"
  expect: 403
  reason: "Food-business capability gate returns 403 before the row is consulted (MenuContentController); a role restriction, not an existence leak."
  fixture: { item: unknown }

# ── KNOWN COVERAGE GAP — validation runs before authorization ────────────────
# These write routes reject an empty body with 422, so the request never reaches
# the ownership check and the matrix cannot assert 404. No data is disclosed —
# the caller learns nothing about identity B's row — but authorization on these
# nine routes is NOT proven by this lane.
#
# Closing the gap means modelling each route's FormRequest well enough to pass
# validation. Tracked as follow-up; deliberately declared here rather than
# silently exempted so the gap is visible in the file and in review.
- route: "PUT api/site/sections/{section}/items/{item}"
  expect: 422
  reason: "COVERAGE GAP: PUT validation rejects an empty body before authorization runs; body not yet modelled."
  fixture: { section: "App\\Models\\Core\\Site\\Section", item: unknown }
- route: "POST api/content/identity/candidates/{candidate}/rule"
  expect: 422
  reason: "COVERAGE GAP: POST validation rejects an empty body before authorization runs; body not yet modelled."
  fixture: { candidate: unknown }
- route: "PUT api/content/items/{item}/overrides"
  expect: 422
  reason: "COVERAGE GAP: PUT validation rejects an empty body before authorization runs; body not yet modelled."
  fixture: { item: unknown }
- route: "PATCH api/services/{service}/category"
  expect: 422
  reason: "COVERAGE GAP: PATCH validation rejects an empty body before authorization runs; body not yet modelled."
- route: "POST api/platforms/shop/brands/{id}/catalog"
  expect: 422
  reason: "COVERAGE GAP: POST validation rejects an empty body before authorization runs; body not yet modelled."
  fixture: { id: unknown }
- route: "PUT api/platforms/shop/brands/{id}/selection"
  expect: 422
  reason: "COVERAGE GAP: PUT validation rejects an empty body before authorization runs; body not yet modelled."
  fixture: { id: unknown }
- route: "POST api/platforms/shopify/brands/{id}/catalog"
  expect: 422
  reason: "COVERAGE GAP: POST validation rejects an empty body before authorization runs; body not yet modelled."
  fixture: { id: unknown }
- route: "PUT api/platforms/shopify/brands/{id}/selection"
  expect: 422
  reason: "COVERAGE GAP: PUT validation rejects an empty body before authorization runs; body not yet modelled."
  fixture: { id: unknown }

- route: "PATCH api/platforms/menu/categories/{category}"
  expect: 422
  reason: "COVERAGE GAP: PATCH validation rejects an empty body before the food-business gate or the ownership check runs; body not yet modelled."
  fixture: { category: unknown }
- route: "api/platforms/menu/categories/{category}"
  fixture: { category: unknown }

# Bare-pattern fallbacks for the two paths whose WRITE verb is a coverage gap.
# Without these, the sibling verbs (which behave correctly and answer 404) would
# have no fixture mapping at all.
- route: "api/site/sections/{section}/items/{item}"
  fixture: { section: "App\\Models\\Core\\Site\\Section", item: unknown }
- route: "api/content/items/{item}/overrides"
  fixture: { item: unknown }
