# ── Verified capability gate, not an existence leak ──────────────────────────
# MenuContentController::…  → $this->error('Menu is not available for your
# account.', 403) — the food-business gate. That is a role/type restriction,
# which the project rule explicitly reserves 403 for, and it fires before the
# row is ever consulted so it leaks nothing.
#
# PATCH is here rather than with the write bodies below because supplying a
# `body:` does not make it answer 404: with validation cleared the request
# reaches denyWithoutCapability() and is refused there, exactly as its DELETE
# sibling already is. A PROVEN 403 at a declared gate, not an inconclusive 422.
- route: "PATCH api/platforms/menu/categories/{category}"
  expect: 403
  reason: "Food-business capability gate returns 403 before the row is consulted (MenuContentController); a role restriction, not an existence leak."
  body: { name: "authz" }                        # UpdateMenuCategoryRequest: name required|string|max:120
  fixture: { category: unknown }
- route: "DELETE api/platforms/menu/categories/{category}"
  expect: 403
  reason: "Food-business capability gate returns 403 before the row is consulted (MenuContentController); a role restriction, not an existence leak."
  fixture: { category: unknown }
- route: "api/platforms/menu/items/{item}"
  expect: 403
  reason: "Food-business capability gate returns 403 before the row is consulted (MenuContentController); a role restriction, not an existence leak."
  fixture: { item: unknown }

# ── WRITE ROUTES — minimal bodies, so validation cannot pre-empt authorization ─
# A PATCH/PUT/POST whose FormRequest rejects an empty body answers 422 before
# the ownership check ever runs, and a 422 is scored INCONCLUSIVE → fail. Each
# body below is the fewest fields that clear that route's rules — deliberately
# not a realistic payload — so the 404 that follows is produced by the ownership
# check and by nothing else.
#
# None of these bodies names identity B's data. A body carrying B's ids would
# make the request pass validation for the wrong reason and prove nothing about
# who the path segment belongs to.
- route: "PUT api/site/sections/{section}/items/{item}"
  body: { state: excluded }                      # UpsertSectionItemRequest: state required|in:pinned,excluded
  fixture: { section: "App\\Models\\Core\\Site\\Section", item: unknown }
- route: "POST api/content/identity/candidates/{candidate}/rule"
  body: { verdict: different }                   # RuleIdentityCandidateRequest: verdict required|in:same,different
  fixture: { candidate: unknown }
# `value` is `present`, not `required` — an explicit null is the user clearing
# the field — so the key must appear even though it is null. (facet, column)
# must be a real FacetRegistry pair or the closure rule fails it.
- route: "PUT api/content/items/{item}/overrides"
  body: { facet: f_text, column: headline, value: null }
  fixture: { item: unknown }
# category_ids REPLACES the membership set, and the request's after() hook only
# demands that one of the two keys be PRESENT. An empty list satisfies it
# without naming any category — least of all one of identity B's.
- route: "PATCH api/services/{service}/category"
  body: { category_ids: [] }

# /shop and /shopify are one `foreach (['shop', 'shopify'])` alias loop over the
# same ShopController (routes/api/platforms.php), so both spellings take the
# identical body. `products` is `required|array`, which an EMPTY array fails, so
# the minimum is one element satisfying `products.*` => array.
- route: "POST api/platforms/shop/brands/{id}/catalog"
  body: { products: [{}] }
  fixture: { id: unknown }
- route: "POST api/platforms/shopify/brands/{id}/catalog"
  body: { products: [{}] }
  fixture: { id: unknown }
# productIds — camelCase, and `present`, so an empty list clears it.
- route: "PUT api/platforms/shop/brands/{id}/selection"
  body: { productIds: [] }
  fixture: { id: unknown }
- route: "PUT api/platforms/shopify/brands/{id}/selection"
  body: { productIds: [] }
  fixture: { id: unknown }

# Bare-pattern fallbacks for paths whose verbs carry a method-scoped entry
# above. Without these, the sibling verbs (which answer 404 already) would have
# no fixture mapping at all.
- route: "api/platforms/menu/categories/{category}"
  fixture: { category: unknown }
- route: "api/site/sections/{section}/items/{item}"
  fixture: { section: "App\\Models\\Core\\Site\\Section", item: unknown }
- route: "api/content/items/{item}/overrides"
  fixture: { item: unknown }
