# Deliberately the strong form: a sentinel here would 404 trivially and hide it.
- route: "api/routing/connections/{connection}/primary"
  fixture: { connection: "App\\Models\\Core\\Site\\IntegrationConnection" }

- route: "api/routing/suggestions/{intent}/accept"
  expect: exempt
  reason: "{intent} is a routing-intent key from the catalog (e.g. 'book', 'shop'), not a stored row."
- route: "api/routing/suggestions/{intent}/dismiss"
  expect: exempt
  reason: "{intent} is a routing-intent key from the catalog, not a stored row."

