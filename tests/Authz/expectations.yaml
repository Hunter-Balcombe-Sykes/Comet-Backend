# Fixture mappings and exemptions for the authorization matrix.
#
# THE DEFAULT IS INCLUSION. Every api/ route carrying a {param} is fired
# cross-tenant. This file exists for three things only:
#
#   fixture: { p: <Model FQCN> }
#       Which of identity B's rows to substitute, when reflection could not work
#       it out from the controller signature. This is the STRONG form — a real
#       cross-tenant probe.
#
#   fixture: { p: unknown }
#       The param is not a model primary key. The platform controllers resolve
#       {id} as a `resource_id` looked up INSIDE rows already scoped to the
#       caller (`$this->accountRows($user)->firstWhere('resource_id', $id)`), so
#       there is no identity-B PK to substitute and the id space is per-user.
#       These are still probed, with an id matching nothing. WEAKER than the
#       strong form: it proves the user-scoped lookup 404s rather than 500ing or
#       leaking. Declared explicitly so the weakness shows up in a diff.
#
#   expect: exempt  +  reason:
#       The param is not a resource identifier at all (a platform slug, a block
#       type, an intent key). A `reason:` is MANDATORY and must name what the
#       param actually identifies. "Not applicable" is not a reason.
#
# Optional `body:` supplies a minimal request body for write routes whose
# validation would otherwise reject with 422 before authorization ran. A 422 is
# scored as a FAILURE, not a pass.
#
# Patterns are literal. Globs are deliberately unsupported: a glob that quietly
# captures a route it should not is the exact failure mode this harness exists
# to prevent.
#
# Spec: docs/superpowers/specs/2026-07-30-authz-test-harness-design.md

